<!-- ============================================================
     PART 2 of 3 — styles. Every rule is scoped under .ldw so it
     cannot collide with your theme's CSS.
     ============================================================ -->
<style>
.ldw{
  --ldw-navy:#072E63;
  --ldw-blue:#1482E6;
  --ldw-orange:#F77802;
  --ldw-orange-soft:#FDEEDC;
  --ldw-bg:#F7F8FA;
  --ldw-surface:#FFFFFF;
  --ldw-surface-2:#EDF1F6;
  --ldw-fg:#0E2444;
  --ldw-muted:#5B6B82;
  --ldw-line:#DCE3EC;
  --ldw-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --ldw-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --ldw-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

  background:var(--ldw-bg);
  color:var(--ldw-fg);
  font-family:var(--ldw-body);
  font-size:16px;
  line-height:1.65;
  box-sizing:border-box;
}
.ldw *,.ldw *::before,.ldw *::after{box-sizing:border-box}
.ldw img{max-width:100%;display:block}

.ldw-wrap{
  max-width:1160px;margin-inline:auto;
  padding-left:max(20px, env(safe-area-inset-left, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-block:clamp(2.5rem,6vw,4rem);
}
.ldw-head{display:grid;gap:.5rem;margin-bottom:2rem;max-width:68ch}
.ldw-eyebrow{
  font-family:var(--ldw-display);font-size:.72rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ldw-orange);margin:0;
}
.ldw-head h2{
  font-family:var(--ldw-display);font-size:clamp(1.55rem,3.4vw,2.3rem);font-weight:700;
  letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0;color:var(--ldw-fg);
}
.ldw-lede{font-size:clamp(1rem,1.9vw,1.14rem);color:var(--ldw-muted);max-width:62ch;margin:.5rem 0 0}

.ldw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,335px),1fr));gap:1.4rem}

.ldw-card{
  background:var(--ldw-surface);border:1px solid var(--ldw-line);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;min-width:0;
  box-shadow:0 1px 2px rgba(7,46,99,.06), 0 12px 30px -16px rgba(7,46,99,.34);
  transition:transform .22s ease, border-color .22s ease;
}
.ldw-card:hover{transform:translateY(-3px);border-color:#8FC0F0}
@media (prefers-reduced-motion: reduce){.ldw-card,.ldw-card:hover{transition:none;transform:none}}

.ldw-frame{background:var(--ldw-surface-2);border-bottom:1px solid var(--ldw-line)}
.ldw-chrome{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;border-bottom:1px solid var(--ldw-line)}
.ldw-dots{display:flex;gap:.3rem;flex:none}
.ldw-dots i{width:8px;height:8px;border-radius:50%;background:var(--ldw-line);display:block}
.ldw-dots i:first-child{background:#F6B877}
.ldw-url{
  flex:1;min-width:0;font-family:var(--ldw-mono);font-size:.66rem;color:var(--ldw-muted);
  background:var(--ldw-bg);border:1px solid var(--ldw-line);border-radius:999px;padding:.18rem .6rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ldw-shot{position:relative;aspect-ratio:12/5;max-width:100%;overflow:hidden;background:var(--ldw-surface-2)}
.ldw-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}

.ldw-body{padding:1.05rem 1.15rem 1.2rem;display:flex;flex-direction:column;gap:.55rem;flex:1;min-width:0}
.ldw-tag{
  align-self:flex-start;font-family:var(--ldw-display);font-size:.65rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:.2rem .5rem;border-radius:5px;
  color:var(--ldw-orange);background:var(--ldw-orange-soft);
}
.ldw-body h3{font-family:var(--ldw-display);font-size:1.06rem;font-weight:700;line-height:1.15;margin:0;color:var(--ldw-fg)}
.ldw-body p{margin:0;font-size:.88rem;color:var(--ldw-muted)}
.ldw-foot{margin-top:auto;padding-top:.7rem}
.ldw-visit{
  font-family:var(--ldw-display);font-size:.82rem;font-weight:700;color:var(--ldw-blue);
  text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;
}
.ldw-visit:hover{text-decoration:underline}
.ldw :focus-visible{outline:2px solid var(--ldw-orange);outline-offset:3px;border-radius:4px}
</style>
</head>
<body style="margin:0">

<!-- ============================================================
     PART 3a of 3 — markup. Paste this where the section goes.
     ============================================================ -->
<section class="ldw" id="work">
  <div class="ldw-wrap">
    <div class="ldw-head">
      <p class="ldw-eyebrow">Selected work</p>
      <h2>Demo builds you can open and judge</h2>
      <p class="ldw-lede">Each card shows the live home page of the build. Open any of them and try the menus, filters, calculators and booking forms — everything on these pages works.</p>
    </div>
    <div class="ldw-grid" id="ldwGrid"></div>
  </div>
</section>

  function hostOf(url){
    try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function card(p){
    var el = document.createElement("article");
    el.className = "ldw-card";
    el.innerHTML =
      '<div class="ldw-frame">' +
        '<div class="ldw-chrome"><span class="ldw-dots"><i></i><i></i><i></i></span>' +
        '<span class="ldw-url">' + esc(hostOf(p.url)) + '</span></div>' +
        '<div class="ldw-shot"></div>' +
      '</div>' +
      '<div class="ldw-body">' +
        '<span class="ldw-tag">' + esc(p.type) + '</span>' +
        '<h3>' + esc(p.name) + '</h3>' +
        '<p>' + esc(p.note) + '</p>' +
        '<div class="ldw-foot">' +
          '<a class="ldw-visit" href="' + encodeURI(p.url) + '" target="_blank" rel="noopener">Open site \u2192</a>' +
        '</div>' +
      '</div>';
    var src = LDW_SHOTS[p.shot];
    if (src){
      var img = new Image();
      img.alt = p.name + " home page";
      img.loading = "lazy";
      img.src = src;
      el.querySelector(".ldw-shot").appendChild(img);
    }
    return el;
  }

  var grid = document.getElementById("ldwGrid");
  if (grid){
    LDW_WORK.forEach(function(p){ grid.appendChild(card(p)); });
  }
